name: sanketa_app
description: "Sanketa — universal TV remote + casting (OmniBeam Living UI)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  google_fonts: ^6.2.1
  path_provider: ^2.1.5
  sanketa_core:
    path: ../sanketa_core
  sanketa_design:
    path: ../sanketa_design
  sanketa_adapters:
    path: ../sanketa_adapters
  sanketa_discovery:
    path: ../sanketa_discovery
  sanketa_ir:
    path: ../sanketa_ir
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  chewie: ^1.8.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sanketa_logo.png
    - assets/irdb/catalog.json
    - assets/irdb/codesets/
    - assets/kookong/catalog.json
    - assets/kookong/codesets/
    - assets/bloatware/database.json
    - assets/debloat/
